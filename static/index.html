<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="wordmark">Chats</span>
        <button class="btn-new" id="newChat" type="button">New chat</button>
      </div>
      <nav class="chat-list" id="chatList" aria-label="Chats"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu" id="menu" type="button" aria-label="Show chats">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
        </button>
        <h1 class="chat-title" id="chatTitle">New chat</h1>
        <button class="btn-ghost" id="summaryBtn" type="button" aria-haspopup="dialog" hidden>Show summary</button>
      </header>

      <section class="thread" id="thread">
        <div class="column" id="messages"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Write a message" aria-label="Message"></textarea>
          <div class="composer-bar">
            <label class="toggle">
              <input type="checkbox" id="useWeb">
              <span class="box" aria-hidden="true"></span>
              <span>Use web tool</span>
            </label>
            <button class="send" id="send" type="submit" aria-label="Send message">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14.5v-11M4.5 8 9 3.5 13.5 8"/></svg>
            </button>
          </div>
        </form>
        <p class="hint">Enter to send, Shift+Enter for a new line</p>
      </footer>
    </main>
  </div>

  <div class="drawer-scrim" id="summaryScrim"></div>
  <aside class="drawer" id="summaryPanel" role="dialog" aria-modal="true" aria-labelledby="summaryHeading" inert>
    <header class="drawer-head">
      <h2 id="summaryHeading">Chat summary</h2>
      <button class="icon-btn" id="summaryClose" type="button" aria-label="Close summary">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l10 10M14 4 4 14"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="summaryBody"></div>
  </aside>
</body>
</html>
